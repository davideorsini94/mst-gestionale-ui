# Configurazione dell'immagine Docker dell'interfaccia (copiata in /etc/nginx/conf.d/default.conf, cioè dentro il
# blocco http del nginx.conf standard). In produzione il server monta invece deploy-v1.4/nginx.conf come
# /etc/nginx/nginx.conf: le due configurazioni devono restare allineate.

# niente versione di nginx nelle risposte e nelle pagine di errore
server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

# Cache-Control per percorso. Un unico add_header a livello server: un add_header dentro una location
# cancellerebbe quelli di sicurezza ereditati. Valore vuoto = header non aggiunto (/api decide il backend).
#  - /assets/: file con hash nel nome, immutabili
#  - index.html, sw.js, manifest.json e tutto il resto: sempre rivalidati
map $uri $mst_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    add_header Cache-Control $mst_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DNS interno di Docker: con l'indirizzo del backend in una variabile nginx lo risolve a ogni richiesta (cache
    # 10s). Così parte anche se il backend non è ancora avviato e non resta con l'IP vecchio dopo che il container
    # del backend è stato ricreato.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $mst_backend http://mst-gestionale-be:3000;

    # Asset con hash nel nome: immutabili. Se mancano → 404 (MAI index.html al posto di un .js)
    location /assets/ {
        try_files $uri =404;
    }

    # Entry point, service worker e manifest: sempre rivalidati (Cache-Control dalla map)
    location = /index.html {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy per le API del backend (URI inoltrato invariato: /api/... → backend /api/...)
    location /api/ {
        proxy_pass $mst_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # gli stessi header li mette anche il backend: si tengono solo quelli aggiunti qui (niente doppioni)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # import Excel e manutenzione dati (rigenerazione ricevute) possono durare qualche minuto
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        # upload: import Excel, documenti (max 50 MB) e restore dei backup dall'app
        client_max_body_size 1100m;
    }
}
